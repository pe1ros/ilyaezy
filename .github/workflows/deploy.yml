name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # пререндер для поисковиков, index.html (en), ru/index.html, sitemap.xml
      - run: npm run build

      # на сайт уходят только его файлы, без скриптов и package.json
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html ru img og.png robots.txt sitemap.xml _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Pages иногда не сразу видит загруженную сборку, поэтому одна повторная попытка
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
